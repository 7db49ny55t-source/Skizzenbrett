async function data(){if(window.SKZ_ENC)return b64(window.SKZ_ENC).buffer;const r=await fetch('app.enc',{cache:'no-cache'});if(!r.ok)throw new Error('net');return r.arrayBuffer()}
async function open(k){
  let buf;try{buf=await data()}catch(e){$('msg').textContent='Die App konnte nicht geladen werden. Bitte einmal mit Internet öffnen.';return}
  let html;try{const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);const u=new Uint8Array(buf);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));
    html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  catch(e){lock(get(LSK)===k?'Der gespeicherte Schlüssel passt nicht mehr. Bitte den aktuellen Entsperr-Link verwenden.':'Dieser Schlüssel passt nicht.');return}
  put(LSK,k);document.open();document.write(html);document.close()}
const fromUrl=pick(location.hash);if(fromUrl){put(LSK,fromUrl);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
$('go').onclick=()=>{const k=pick($('k').value);if(!k){$('err').textContent='Das ist kein gültiger Entsperr-Link.';return}$('lock').hidden=true;$('wait').hidden=false;open(k)};
$('k').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
const k=fromUrl||get(LSK);if(k)open(k);else lock();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
