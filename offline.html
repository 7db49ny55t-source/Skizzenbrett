/* Start page: the app itself is stored encrypted (AES-GCM) in app.enc. With the key it is decrypted on this device and started. */
(function(){
const LSK='skz.key',$=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const pick=s=>{s=String(s||'').trim();const m=s.match(/[#&?]k=([A-Za-z0-9_-]{40,})/);return m?m[1]:/^[A-Za-z0-9_-]{40,}$/.test(s)?s:null};
const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
function lock(msg){$('wait').hidden=true;$('lock').hidden=false;$('err').textContent=msg||''}
async function data(){if(window.SKZ_ENC)return b64(window.SKZ_ENC).buffer;const r=await fetch('app.enc',{cache:'no-cache'});if(!r.ok)throw new Error('net');return r.arrayBuffer()}
async function open(k){
  let buf;try{buf=await data()}catch(e){$('msg').textContent='Die App konnte nicht geladen werden. Bitte einmal mit Internet öffnen.';return}

    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));
